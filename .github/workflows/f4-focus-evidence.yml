name: F4 single bounded focus observation
on:
  push:
    branches: [evidence/p0-layout-receiver]
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {java-version: '21', distribution: temurin}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Build real Host Editor only
        run: ./gradlew :acceptance-host:testDebugUnitTest :acceptance-host:assembleDebug --no-build-cache --rerun-tasks --stacktrace
      - name: Stage exact previously reviewed read-only collector
        run: |
          mkdir -p build/f4-health-tools
          for file in emulator_health.py r2_ci_protocol.py r2_current_instrumentation_manifest.json p1_acceptance_device.py p1_instrumentation_manifest.json; do
            git show aa1bf8753a9e66ab249ba6921cd4ea22a3810a06:scripts/"$file" > build/f4-health-tools/"$file"
          done
      - name: Deterministic fail-closed wrapper fixtures (no ADB)
        run: |
          python3 -B .github/f4/test_focus_protocol.py -v
          python3 -B .github/f4/test_h1_stage.py -v
          python3 -B .github/f4/test_trace_protocol.py -v
      - name: KVM on disposable GitHub runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fresh Pixel 2 API33 H0 then H1 once
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          cores: 2
          force-avd-creation: true
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 .github/f4/run_focus_experiment.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: f4-focus-health-evidence
          path: |
            build/f4-health/
            acceptance-host/build/outputs/apk/debug/*.apk
            acceptance-host/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
