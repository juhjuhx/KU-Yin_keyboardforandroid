name: F3 bounded QR evidence
on:
  push:
    branches: [evidence/f3-qr-red]
permissions:
  contents: read
jobs:
  qr-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {java-version: "21", distribution: temurin}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: "platform-tools ndk;28.2.13676358 cmake;3.22.1"}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - run: bash scripts/bootstrap_native_deps.sh
      - name: Fresh focused QR regressions
        run: ./gradlew :app:testDebugUnitTest --tests 'com.example.ime.DonationQr*' --no-build-cache --rerun-tasks --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: f3-qr-focused-junit
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
      - name: Real Roborazzi record
        run: ./gradlew :app:recordRoborazziDebug --tests com.example.GreetingScreenshotTest --no-build-cache --rerun-tasks --stacktrace
      - name: Bind output to actual source
        run: |
          python3 - <<'PYCODE'
          import json,hashlib,os
          from pathlib import Path
          paths=['app/src/test/java/com/example/GreetingScreenshotTest.kt','app/src/main/java/com/example/MainActivity.kt','app/build.gradle.kts','gradle/libs.versions.toml','app/src/test/screenshots/greeting.png']
          Path('render-evidence.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'command':'./gradlew :app:recordRoborazziDebug --tests com.example.GreetingScreenshotTest --no-build-cache --rerun-tasks --stacktrace','exit':0,'files':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}},indent=2)+'\n')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f3-qr-actual-render-evidence
          path: |
            render-evidence.json
            app/src/test/screenshots/greeting.png
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
