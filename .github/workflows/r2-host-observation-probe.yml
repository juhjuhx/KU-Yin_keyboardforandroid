name: R2 Test-Only Host Observation Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r2-host-observation-probe.yml'
      - 'acceptance-host/src/sharedTest/java/io/github/juhjuhx/kuyin/acceptancehost/UiReadTrace.kt'
      - 'acceptance-host/src/androidTest/java/io/github/juhjuhx/kuyin/acceptancehost/ExternalUiObservation.kt'
  workflow_dispatch:
    inputs:
      host_scope:
        description: 'Finite diagnostic scope; never full acceptance'
        type: choice
        default: sequence
        options: [sequence, identity, geometry, binding]

permissions:
  contents: read

jobs:
  probe:
    if: (github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'fix/r2-')) && inputs.host_scope != 'binding'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;28.2.13676358 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify protected source and record diagnostic provenance
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess, tomllib
          baseline = '63c9e4ab8ad7e277013acb5d7cce99228ec1f827'
          protected = ['app/src/main', 'acceptance-host/src/main', 'app/build.gradle.kts', 'acceptance-host/build.gradle.kts', 'gradle', 'scripts/bootstrap_native_deps.sh', 'LICENSE', 'NOTICE']
          catalog = 'gradle/libs.versions.toml'
          assert not subprocess.check_output(['git', 'diff', baseline, 'HEAD', '--', *protected, ':(exclude)' + catalog])
          before = tomllib.loads(subprocess.check_output(['git', 'show', baseline + ':' + catalog], text=True))
          after = tomllib.loads(subprocess.check_output(['git', 'show', 'HEAD:' + catalog], text=True))
          assert before['versions'].pop('uiautomator') == '2.3.0'
          test_version = after['versions'].pop('uiautomator')
          assert test_version in {'2.3.0', '2.4.0'} and before == after
          source = {'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'baseline': baseline, 'scope': 'FOCUSED_DIAGNOSTIC_NOT_ACCEPTANCE',
                    'host_test_uiautomator': test_version,
                    'catalog_sha256': hashlib.sha256(pathlib.Path(catalog).read_bytes()).hexdigest(), 'files': {}}
          for directory in ['app/src', 'acceptance-host/src', 'scripts']:
              for path in sorted(pathlib.Path(directory).rglob('*')):
                  if path.is_file() and path.suffix in ['.kt', '.py', '.sh']:
                      source['files'][str(path)] = hashlib.sha256(path.read_bytes()).hexdigest()
          pathlib.Path('r2-probe-source-manifest.json').write_text(json.dumps(source, indent=2))
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Complete App prerequisite then finite diagnostic Host scope
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KUYIN_R2_OBSERVER: 'true'
          KUYIN_R2_HOST_PROBE: ${{ inputs.host_scope == 'geometry' && 'geometry' || inputs.host_scope == 'identity' && 'identity' || 'true' }}
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_7
          avd-name: r2_host_probe
          force-avd-creation: true
          disable-animations: true
          disable-spellchecker: true
          script: bash scripts/runtime_smoke.sh
      - name: Preserve exact scope and every raw result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-host-observation-probe
          path: |
            r2-probe-source-manifest.json
            build/r2-runtime-evidence
            app/build/outputs/androidTest-results/connected
            acceptance-host/build/outputs/androidTest-results/connected
          if-no-files-found: error

  binding-isolation:
    if: github.event_name == 'workflow_dispatch' && inputs.host_scope == 'binding'
    runs-on: ubuntu-latest
    # Two fresh sequential emulators plus the existing ~30-minute full Host suite.
    # No individual visibility/selector timeout is changed.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;28.2.13676358 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM as in the successful R2 runtime job
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify unchanged Android sources and build shared four APKs once
        run: |
          git diff --exit-code 2b8e8e4efff73741319fb00daf4cb4e58101e4e8 HEAD -- app/src acceptance-host/src app/build.gradle.kts acceptance-host/build.gradle.kts gradle scripts/bootstrap_native_deps.sh
          python3 -m unittest discover -s scripts/tests -v
          for contract in scripts/check_*.py; do python3 "$contract"; done
          bash scripts/bootstrap_native_deps.sh
          ./gradlew :app:testDebugUnitTest :acceptance-host:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :acceptance-host:assembleDebug :acceptance-host:assembleDebugAndroidTest --stacktrace
          mkdir -p build/r22-shared
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk acceptance-host/build/outputs/apk/debug/acceptance-host-debug.apk acceptance-host/build/outputs/apk/androidTest/debug/acceptance-host-debug-androidTest.apk > build/r22-shared/SHA256SUMS
          git rev-parse HEAD > build/r22-shared/source-sha.txt
          python3 - <<'PYCODE'
          import hashlib, json, pathlib, subprocess
          paths = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          source = {'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'baseline': '2b8e8e4efff73741319fb00daf4cb4e58101e4e8',
                    'scope': 'CONTROLLED_CI_BINDING_EXPERIMENT_NOT_ACCEPTANCE',
                    'files': {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
                              for name in paths if name.startswith(('app/src/', 'acceptance-host/src/', 'scripts/', '.github/workflows/'))}}
          pathlib.Path('build/r22-shared/source-manifest.json').write_text(json.dumps(source, indent=2))
          PYCODE
          cp scripts/r2_current_instrumentation_manifest.json build/r22-shared/
      - name: A original install-select-connected App sequence
        id: legacy
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KUYIN_R2_OBSERVER: 'true'
          KUYIN_R22_BINDING_ARM: legacy
          KUYIN_R23_HEALTH: 'true'
          KUYIN_R22_APP_ONLY: 'true'
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_7
          avd-name: r22_legacy
          force-avd-creation: true
          disable-animations: true
          disable-spellchecker: true
          script: bash scripts/runtime_smoke.sh
      - name: Preserve A and verify shared APK bytes before B
        id: shared_apk_check
        if: always() && steps.legacy.outcome != 'skipped'
        run: |
          sha256sum --check build/r22-shared/SHA256SUMS
          # A failing binding may still be compared; unhealthy A must never start B.
          python3 - <<'HEALTH'
          import json, pathlib
          for stage in ['h0', 'h1']:
              value = json.loads(pathlib.Path('build/r22-legacy', stage, 'result.json').read_text())
              if value['status'] != 'HEALTHY':
                  raise SystemExit('R2.3 A health refused; B NOT_EXECUTED: ' + stage)
          HEALTH
          mkdir -p build/r22-legacy
          if [ -d app/build/outputs/androidTest-results/connected ]; then cp -R app/build/outputs/androidTest-results/connected build/r22-legacy/app-connected-results; fi
      - name: B install target and test before IME selection then direct instrumentation
        id: preinstalled
        if: always() && steps.shared_apk_check.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KUYIN_R2_OBSERVER: 'true'
          KUYIN_R22_BINDING_ARM: preinstalled
          KUYIN_R23_HEALTH: 'true'
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_7
          avd-name: r22_preinstalled
          force-avd-creation: true
          disable-animations: true
          disable-spellchecker: true
          script: bash scripts/runtime_smoke.sh
      - name: Preserve outcomes without converting a failing arm into PASS
        if: always()
        env:
          LEGACY_OUTCOME: ${{ steps.legacy.outcome }}
          PREINSTALLED_OUTCOME: ${{ steps.preinstalled.outcome }}
        run: |
          mkdir -p build/r22-shared
          printf 'A=%s\nB=%s\n' "$LEGACY_OUTCOME" "$PREINSTALLED_OUTCOME" > build/r22-shared/arm-outcomes.txt
          sha256sum --check build/r22-shared/SHA256SUMS
          test "$LEGACY_OUTCOME" = success && test "$PREINSTALLED_OUTCOME" = success
      - name: Preserve all A and B raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r22-binding-isolation
          path: |
            build/r22-legacy
            build/r22-preinstalled
            build/r22-shared
          if-no-files-found: error
