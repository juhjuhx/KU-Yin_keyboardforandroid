name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Dachen source contract
        run: python3 scripts/check_dachen_contract.py

      - name: Validate P0 keyboard action contract
        run: python3 scripts/check_p0_keyboard_contract.py

      - name: Validate editor synchronization contract
        run: python3 scripts/check_editor_sync_contract.py

      - name: Validate P1 build contract
        run: python3 scripts/check_p1_build_contract.py

      - name: Validate P2 UI contract
        run: python3 scripts/check_p2_ui_contract.py

      - name: Validate P3 architecture/security contract
        run: python3 scripts/check_p3_architecture_security_contract.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "7.6.4"

      - name: Bootstrap pinned native dependencies
        run: bash scripts/bootstrap_native_deps.sh

      - name: Run JVM unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  runtime-smoke:
    name: runtime-smoke (experimental)
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "7.6.4"

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android IME runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_7
          ndk: 27.3.13750724
          cmake: 3.22.1
          disable-animations: true
          disable-spellchecker: true
          script: bash scripts/runtime_smoke.sh

      - name: Upload runtime smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-report
          path: app/build/reports/androidTests/connected
          if-no-files-found: warn
