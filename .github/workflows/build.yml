name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────────
      # PLACEHOLDER — JDK + Android SDK setup
      # The full toolchain wiring (JDK 17, SDK install,
      # licenses acceptance) will land in Wave 2 when the
      # app module and build scripts are present.
      # ──────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        if: ${{ hashFiles('gradlew') != '' }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        # PLACEHOLDER: will fail until app/build.gradle.kts exists

      - name: Build Release AAB
        run: ./gradlew assembleRelease
        # PLACEHOLDER: will fail until app/build.gradle.kts exists

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
