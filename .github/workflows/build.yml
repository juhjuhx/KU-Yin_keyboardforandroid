name: Build

on:
  push:
    branches: [main, c4-compose-libchewing-switch]
  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      run_runtime:
        description: 'Explicitly approved disposable-emulator Runtime experiment'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 0, persist-credentials: false}

      - name: Install launcher validation decoders
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y webp ffmpeg

      - name: Install asset regression Python dependency
        run: python3 -m pip install --disable-pip-version-check Pillow==12.2.0 PyYAML==6.0.3

      - name: Validate complete launcher resources
        run: python3 scripts/check_launcher_assets.py

      - name: Scan tracked repository secrets
        run: python3 scripts/check_repository_secrets.py

      - name: Run Python infrastructure regressions
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Validate documentation and toolchain contracts
        run: |
          python3 scripts/check_docs_consistency.py
          python3 scripts/check_ndk_pin_consistency.py
          python3 scripts/check_ci_c4_trigger.py

      - name: Validate Dachen source contract
        run: python3 scripts/check_dachen_contract.py

      - name: Validate P0 keyboard action contract
        run: python3 scripts/check_p0_keyboard_contract.py

      - name: Validate editor synchronization contract
        run: python3 scripts/check_editor_sync_contract.py

      - name: Validate P1 build contract
        run: python3 scripts/check_p1_build_contract.py

      - name: Validate P2 UI contract
        run: python3 scripts/check_p2_ui_contract.py

      - name: Validate P3 architecture/security contract
        run: python3 scripts/check_p3_architecture_security_contract.py

      - name: Validate production Compose contract
        run: python3 scripts/check_production_compose_contract.py

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools ndk;28.2.13676358 cmake;3.22.1

      - name: Setup Gradle (wrapper)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Bootstrap pinned native dependencies
        run: bash scripts/bootstrap_native_deps.sh

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Compile App and Host instrumentation (no runtime)
        run: ./gradlew :app:assembleDebugAndroidTest :acceptance-host:assembleDebugAndroidTest --stacktrace

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jvm-test-report
          path: |
            app/build/test-results/testDebugUnitTest
            acceptance-host/build/test-results/testDebugUnitTest
          if-no-files-found: warn

      # Release APK stays out until the signing decision lands (no keystore yet).

      - name: Upload Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  runtime-smoke:
    name: runtime-smoke (experimental)
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_runtime == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 0, persist-credentials: false}

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle (wrapper)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android IME runtime smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_7
          ndk: 28.2.13676358
          cmake: 3.22.1
          disable-animations: true
          disable-spellchecker: true
          script: bash scripts/runtime_smoke.sh

      - name: Upload runtime smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-smoke-report
          path: |
            app/build/reports/androidTests/connected
            acceptance-host/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
            acceptance-host/build/outputs/androidTest-results/connected
          if-no-files-found: warn
