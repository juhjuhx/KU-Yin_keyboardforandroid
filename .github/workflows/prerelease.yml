name: Build Experimental Alpha Artifacts (No Publication)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpha-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {java-version: "21", distribution: "temurin"}
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools ndk;28.2.13676358 cmake;3.22.1
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Bootstrap pinned native dependencies
        run: bash scripts/bootstrap_native_deps.sh
      - name: Install verification dependencies
        run: python3 -m pip install Pillow==12.2.0 PyYAML==6.0.3
      - name: Validate infrastructure and contracts
        run: |
          python3 -m unittest discover -s scripts/tests -v
          for check in scripts/check_*.py; do python3 "$check"; done
      - name: Test and build local-testing Alpha
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Prepare explicitly unapproved test artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KU-Yin-CI-TEST-ONLY-debug.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          printf '%s\n' 'TEST_ONLY: NOT A GITHUB RELEASE OR RC.' 'Fresh CI Debug signer may not update the published Alpha. Never uninstall or clear user data as a workaround.' 'No Runtime, device, QR-scan, privacy, signer or full source/relink release approval is implied.' > dist/INSTALL-WARNING.txt
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_SHA.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experimental-alpha-TEST-ONLY-${{ github.sha }}
          path: dist/
          if-no-files-found: error
