name: Publish Alpha Prerelease

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        name: Check existing prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v0.1.0-alpha
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    needs: check-release
    if: needs.check-release.outputs.exists != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "7.6.4"

      - name: Bootstrap pinned native dependencies
        run: bash scripts/bootstrap_native_deps.sh

      - name: Build alpha APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KU-Yin-v0.1.0-alpha-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/KU-Yin-v0.1.0-alpha-release-unsigned.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat > dist/RELEASE-NOTES.md <<'EOF'
          # KU-Yin 0.1.0-alpha

          Early Android Zhuyin IME preview based on libchewing.

          - `KU-Yin-v0.1.0-alpha-debug.apk` is debug-signed and intended for direct testing.
          - `KU-Yin-v0.1.0-alpha-release-unsigned.apk` is an unsigned developer artifact used to verify the release build. It is not a production-signed APK.
          - `SHA256SUMS.txt` contains checksums for the attached APKs.

          Verified before merge on Android 13 emulator: install, IME registration, enable, and select. The headless IME-window-visible runtime smoke assertion remains a known alpha limitation.
          EOF

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v0.1.0-alpha
        run: |
          gh release create "$TAG" \
            dist/KU-Yin-v0.1.0-alpha-debug.apk \
            dist/KU-Yin-v0.1.0-alpha-release-unsigned.apk \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "KU-Yin 0.1.0-alpha" \
            --notes-file dist/RELEASE-NOTES.md \
            --prerelease
